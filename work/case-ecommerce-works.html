<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="ポートフォリオ">
    <meta name="description" content="このサイトは山本さつきのポートフォリオです。">
    <title>Case EC Site - Works｜Yamamoto-Portfolio</title>

    <!--============= Google Analytics ===============-->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!--============= Google Font ===============-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Zen+Kaku+Gothic+New&display=swap"
        rel="stylesheet">

    <!--============= CSS ===============-->
    <link rel="stylesheet" href="../css/destyle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="../css/main.css">

    <!--============= Favicon =============-->
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
</head>

<body id="work" data-case="ecommerce">
    <!--============= Header =============-->
    <header id="header">
        <nav id="g-navi">
            <ul>
                <li><a href="https://gogatsu6.github.io/portfolio/index.html">TOP</a></li>
                <li><a href="https://gogatsu6.github.io/portfolio/index.html#area-2">profile</a></li>
                <li><a href="https://gogatsu6.github.io/portfolio/index.html#area-3">contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="openbtn"><span></span><span></span><span></span></div>


    <main>
        <div class="work-wrapper">


            <!--============= list-area =============-->
            <div class="work-left">
                <div class="innerWrap-work">
                    <!-- パンくず（最小追加） -->
                    <nav class="breadcrumb" aria-label="breadcrumb">
                        <ol>
                            <li><a href="https://gogatsu6.github.io/portfolio/index.html">TOP</a></li>
                            <li><a href="https://gogatsu6.github.io/portfolio/case-ecommerce.html">Case EC Site</a></li>
                            <li><span aria-current="page">Case EC Site - Works</span></li>
                        </ol>
                    </nav>

                    <h1>Case EC Site - Works</h1>
                    <!----------- main-img  ----------->
                    <div class="work-left-gallery" id="work-gallery">
                        <!-- 🔽 ここにJSONの内容をJSで自動挿入する -->
                    </div>

                    <div class="thumbnail-area" id="thumbnail-area">
                        <!----------- sort-list  ----------->
                        <ul class="sort-btn">
                            <li class="sort00 active">all</li>
                            <li class="sort-web">web</li>
                            <li class="sort-pa">paper</li>
                            <li class="sort-oh">other</li>
                        </ul>

                        <!----------- thumbnail-img  ----------->
                        <ul class="grid"></ul>

                        <button class="thumb-prev">‹</button>
                        <button class="thumb-next">›</button>
                        <div class="thumb-indicator">
                            <span class="active"></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!--============= description-area =============-->
            <div class="work-right">
                <button class="page-top"><span></span>
                    <p>PAGE TOP</p>
                </button>

                <div class="innerWrap-work">
                    <div class="work-detail" id="work-detail">
                        <!-- 🔽 ここにもJSONの説明欄などをJSで自動挿入 -->
                    </div>
                </div>
            </div>
        </div><!-- work-wrapper end -->
    </main>

    <div id="works-list"></div>

    <!--============= script.js =============-->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"
        integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="https://unpkg.com/web-animations-js@2.3.2/web-animations.min.js"></script>
    <script src="https://unpkg.com/muuri@0.8.0/dist/muuri.min.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/work.js"></script>

    <!--============= JSONの表示切替 =============-->
    <script>
        fetch("../data/works.json")  // JSONのパスに合わせて変更
            .then(response => response.json())
            .then(works => {

                // hospitalだけ抽出
                const filtered = works.filter(work => work.case === "ecommerce");

                const container = document.getElementById("works-list");

                filtered.forEach(work => {
                    const item = document.createElement("div");
                    item.className = "work-item";

                    item.innerHTML = `
        <img src="${work.thumbnail}" alt="${work.title}">
        <p>${work.title}</p>
      `;

                    container.appendChild(item);
                });

            });
    </script>

</body>

</html>
